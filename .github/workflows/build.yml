name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build-tools
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed APK
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0"
          export VERSION_CODE="${{ github.run_number }}"
          export VERSION_NAME
          bash android/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Squeeze-apk
          path: android/build/Squeeze.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/Squeeze.apk
